name: Kernel Verifier

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/verifier.yml"
      - "Makefile"
      - "prism-agent/**"
      - "prism-core/**"
      - "prism-ebpf/**"
      - "scripts/kernel-verifier-smoke.sh"

jobs:
  verifier:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-22.04-hosted
            runs_on: '"ubuntu-22.04"'
            required: "0"
          - name: ubuntu-24.04-hosted
            runs_on: '"ubuntu-24.04"'
            required: "0"
          - name: linux-5.10-self-hosted
            runs_on: '["self-hosted","linux","kernel-5.10","prism-verifier"]'
            required: "1"
          - name: linux-6.1-self-hosted
            runs_on: '["self-hosted","linux","kernel-6.1","prism-verifier"]'
            required: "1"
    runs-on: ${{ fromJSON(matrix.runs_on) }}
    continue-on-error: ${{ matrix.required != '1' }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-src
          targets: x86_64-unknown-linux-musl

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Use stable by default
        run: rustup default stable

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm linux-tools-common linux-tools-generic musl-tools

      - name: Install bpf-linker
        run: cargo install bpf-linker --locked

      - name: Run verifier smoke
        env:
          PRISM_VERIFIER_REQUIRED: ${{ matrix.required }}
          PRISM_VERIFIER_LOG_DIR: target/verifier-logs/${{ matrix.name }}
        run: make verifier-smoke

      - name: Upload verifier logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verifier-logs-${{ matrix.name }}
          path: target/verifier-logs/${{ matrix.name }}
          if-no-files-found: warn
