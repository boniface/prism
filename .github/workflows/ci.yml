name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt,rust-src
          targets: x86_64-unknown-linux-musl

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy,rustfmt,rust-src

      - name: Use stable by default
        run: rustup default stable

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm linux-tools-common linux-tools-generic musl-tools

      - name: Install Rust tools
        run: |
          cargo install bpf-linker cargo-audit cargo-deny --locked

      - name: Format
        run: make fmt

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Build eBPF
        run: make ebpf

      - name: Audit
        run: make audit
