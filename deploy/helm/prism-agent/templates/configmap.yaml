apiVersion: v1
kind: ConfigMap
metadata:
  name: prism-agent-config
  labels:
    app.kubernetes.io/name: prism-agent
data:
  config.yaml: |
    agent:
      node_name: ${NODE_NAME}
      instance_id: ${NODE_NAME}
    bpf:
      pin_path: /sys/fs/bpf/prism
      ephemeral: true
    metadata:
      providers:
{{ toYaml .Values.metadata.providers | indent 8 }}
    prometheus:
      listen_addr: 0.0.0.0:{{ .Values.prometheus.port }}
    otlp:
      endpoint: http://otel-collector:4317
    security:
      capture_process_exec: true
      capture_command_line: false
      process_exec_fields: []
      file_access_fields: []
      network_connection_fields: []
      max_field_len: 128
      max_event_bytes: 512
      redaction_patterns:
        - authorization
        - cookie
        - password
        - secret
        - token
      file_path_rules: []
      process_rules: []
      network_rules: []
    logging:
      level: info
