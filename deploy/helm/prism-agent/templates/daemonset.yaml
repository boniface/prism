apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: prism-agent
  labels:
    app.kubernetes.io/name: prism-agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: prism-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prism-agent
    spec:
      serviceAccountName: prism-agent
      automountServiceAccountToken: {{ .Values.kubernetes.apiEnrichment.enabled }}
      hostPID: true
      hostNetwork: true
      containers:
        - name: prism-agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --config
            - /etc/prism/config.yaml
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: PRISM_EBPF_OBJECT
              value: /usr/lib/prism/prism-ebpf
            - name: PRISM_BPF_PIN_PATH
              value: /sys/fs/bpf/prism
          ports:
            - name: metrics
              containerPort: {{ .Values.prometheus.port }}
          securityContext:
{{ toYaml .Values.securityContext | indent 12 }}
          resources:
{{ toYaml .Values.resources | indent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/prism
              readOnly: true
            - name: bpffs
              mountPath: /sys/fs/bpf
            - name: cgroup
              mountPath: /sys/fs/cgroup
              readOnly: true
            - name: cri-socket
              mountPath: {{ .Values.metadata.criSocketPath }}
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: prism-agent-config
        - name: bpffs
          hostPath:
            path: /sys/fs/bpf
            type: Directory
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
        - name: cri-socket
          hostPath:
            path: {{ .Values.metadata.criSocketPath }}
            type: Socket
