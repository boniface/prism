agent:
  node_name: docker-host
  instance_id: prism-docker

bpf:
  object_path: /usr/lib/prism/prism-ebpf
  pin_path: /sys/fs/bpf/prism
  ephemeral: true

metadata:
  providers:
    - docker

prometheus:
  listen_addr: 127.0.0.1:9090
  label_allowlist:
    - cgroup-id
    - container-name
  max_label_value_len: 128
  expensive_dimensions_enabled: true
  series_limit: 10000

otlp:
  endpoint: http://127.0.0.1:4317

security:
  capture_process_exec: true
  capture_command_line: false

logging:
  level: info
